name: Build ARM64 ELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install ARM64 GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build ELF
        run: |
          aarch64-linux-gnu-gcc -Os -nostdlib -ffreestanding -fno-stack-protector -c ./cli_loop.c -o ./cli_loop.o
          aarch64-linux-gnu-ld -Ttext=0x02000000 --entry=_start --no-dynamic-linker -nostdlib --gc-sections -o cli_loop.elf cli_loop.o
          file cli_loop.elf
          aarch64-linux-gnu-readelf -h cli_loop.elf
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli_loop-elf
          path: cli_loop.elf
          if-no-files-found: error
          retention-days: 1
